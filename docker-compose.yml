services:
  jenga2:
    build: .
    image: jenga2:local
    container_name: jenga2-web
    restart: unless-stopped
    ports:
      - "${JENGA_BIND:-127.0.0.1}:${JENGA_PORT:-8784}:80"   # Max: cloudflared routes jenga2.mayorawesome.com -> localhost:8784
    labels:
      - com.centurylinklabs.watchtower.enable=false
